# Builds the iPhone/web client (apps/pwa) and publishes it to GitHub Pages.
# Repo → Settings → Pages → Source: "GitHub Actions".
name: web app → GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apps/pwa/**', 'protocol/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - run: npm ci
      # Protocol parity + browser-node tests (the Dart interop test needs Flutter; run it locally).
      - run: npx vitest run --exclude test/interop.test.ts
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
